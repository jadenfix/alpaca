name: Offline research regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s scripts/data/tests -p test_walkforward.py
      - run: python scripts/backtest/smoke.py --out artifacts/research-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: held-out-research-curves
          path: artifacts/research-smoke.json
